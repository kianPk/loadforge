[package]
name = "loadforge"
version = "0.1.0"
edition = "2021"
description = "High-concurrency HTTP load forge — Tokio workers, live Axum + WebSocket dashboard"
license = "MIT"
repository = "https://github.com/kianPk/loadforge"
homepage = "https://kianpk.github.io/loadforge/"
keywords = ["load-test", "http", "benchmark", "tokio", "axum"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
readme = "README.md"

[[bin]]
name = "loadforge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
futures = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
